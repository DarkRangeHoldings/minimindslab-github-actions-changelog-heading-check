name: "Changelog Entry Check"
description: "Fails a workflow when a changelog text does not contain the required release heading."
inputs:
  payload:
    description: "JSON payload consumed by the action"
    required: true
outputs:
  result:
    description: "Compact JSON result produced by the action"
runs:
  using: "node24"
  main: "index.js"
branding:
  icon: "check-circle"
  color: "blue"
